<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinematic Intelligence — GTA VI Cover Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">CINEMATIC <span>INTELLIGENCE</span></div>
  <div class="tagline">Launch-day cover maker · your photos never leave this device</div>
</header>

<main class="layout">
  <section class="stage">
    <canvas id="preview" width="1100" height="619"></canvas>
    <p class="hint">Drag a photo to reposition it · scroll over the cover to zoom a panel</p>
  </section>

  <aside class="panel">
    <h2>Photo</h2>
    <div class="row wrap" id="sample-row">
      <button type="button" data-sample="neon-drive">Neon Drive</button>
      <button type="button" data-sample="storm-drive">Storm Drive</button>
      <button type="button" data-sample="aerial-watch">Aerial Watch</button>
      <button type="button" data-sample="open-top">Open Top</button>
    </div>
    <label class="field">Load your own photo(s)
      <input type="file" id="f-file" accept="image/*" multiple>
    </label>
    <label class="field">Sample / upload goes to panel
      <select id="f-panel-target">
        <option value="0">Panel 1</option>
        <option value="1">Panel 2</option>
        <option value="2">Panel 3</option>
      </select>
    </label>

    <h2>Layout</h2>
    <div class="row wrap">
      <button type="button" data-layout="editorial">Editorial</button>
      <button type="button" data-layout="diptych">Diptych</button>
      <button type="button" data-layout="triptych">Triptych</button>
    </div>
    <label class="field">Export size
      <select id="f-size"></select>
    </label>

    <h2>Cover lines</h2>
    <label class="field">Masthead <input type="text" id="f-masthead"></label>
    <label class="field">Issue line <input type="text" id="f-issue"></label>
    <label class="field">Kicker <input type="text" id="f-kicker"></label>
    <label class="field">Title <input type="text" id="f-title"></label>
    <label class="field">Deck <textarea id="f-deck" rows="3"></textarea></label>
    <label class="field">Facts bar <input type="text" id="f-facts"></label>
    <div data-caption-wrap="0"><label class="field">Panel 1 caption <input type="text" data-caption="0"></label></div>
    <div data-caption-wrap="1"><label class="field">Panel 2 caption <input type="text" data-caption="1"></label></div>
    <div data-caption-wrap="2"><label class="field">Panel 3 caption <input type="text" data-caption="2"></label></div>

    <h2>Grade</h2>
    <label class="field">Grade strength <span id="grade-val"></span>
      <input type="range" id="f-grade" min="0" max="140" step="1">
    </label>
    <label class="check"><input type="checkbox" id="f-bloom"> Neon bloom</label>
    <label class="check"><input type="checkbox" id="f-grain"> Fine grain</label>

    <button type="button" id="export-btn" class="export">Export cover PNG</button>
    <p class="note">One render path drives the preview and the export, so the PNG is exactly what you see.</p>
  </aside>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
